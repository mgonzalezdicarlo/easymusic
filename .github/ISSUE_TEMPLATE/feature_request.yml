name: Feature request
description: Suggest an improvement or a new feature
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, then the solution you have in mind.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Dashboard / heat map / streaks
        - Scales
        - Exercises (Hanon / Czerny / custom)
        - Analytics / charts
        - Authentication / settings
        - Metronome
        - Tooling / CI / build
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What are you trying to do, and what is getting in the way?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should the app do? Sketches and examples are welcome.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will we know it is done?
      value: |
        - [ ] 
        - [ ]
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why you did not pick them.
    validations:
      required: false
