name: easymusic

services:
  db:
    image: postgres:17-alpine
    container_name: easymusic-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: piano
      POSTGRES_PASSWORD: piano
      POSTGRES_DB: piano
    ports:
      # Bound to localhost only, so the database is not exposed to your network.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U piano -d piano"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
